services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: messenger-backend
    environment:
      MESSENGER_JWT_SECRET_KEY: "change-me-in-docker-please-32chars-min"
      MESSENGER_SQLITE_PATH: "/data/app.db"
      MESSENGER_DB_ECHO: "false"
      MESSENGER_SMTP_ENABLED: "false"
      MESSENGER_PASSWORD_RESET_FRONTEND_URL: "http://localhost/reset-password"
    volumes:
      - backend_data:/data
      # Монтируем исходники backend, чтобы изменения применялись без пересборки образа
      # (полезно, когда Docker Hub временно отдаёт 500 на auth/token).
      - ./backend:/app/backend
      - ./backend/media:/app/backend/media
      - ./backend/outbox:/app/backend/outbox
    ports:
      - "8000:8000"

  client-build:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: messenger-client-build
    profiles: ["build"]

volumes:
  backend_data:


